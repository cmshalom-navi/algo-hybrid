[project]
name = "algo-hybrid"
version = "0.1.0"
description = "Async optimization service (OR-Tools) with a structured-request API"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "boto3",
    "ortools",
]

[dependency-groups]
dev = [
    "pytest",
    "moto",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pydocstyle, pep8-naming, type annotations.
select = ["E", "F", "I", "D", "N", "ANN"]
# The Google guide permits Any and doesn't require docstrings in empty
# __init__.py files.
ignore = ["ANN401", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-sort-within-sections = true
# Google style: one import per line, except for typing.
force-single-line = true
single-line-exclusions = ["typing"]

[tool.mypy]
python_version = "3.11"

# These libraries ship without type stubs or a py.typed marker.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "ortools.*"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["domain", "services", "common"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
