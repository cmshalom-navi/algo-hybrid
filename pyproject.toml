[project]
name = "algo-hybrid"
version = "0.1.0"
description = "Async optimization service (OR-Tools) with a structured-request API"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "boto3",
    "ortools",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "moto",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pydocstyle, pep8-naming, type annotations.
select = ["E", "F", "I", "D", "N", "ANN"]
# The Google guide permits Any and doesn't require docstrings in empty
# __init__.py files.
ignore = ["ANN401", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.hatch.build.targets.wheel]
packages = ["domain", "services", "common"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
