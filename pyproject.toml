[project]
name = "algo-hybrid"
version = "0.1.0"
description = "Async optimization service (OR-Tools) with a structured-request API"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "boto3",
    "ortools",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "moto",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
